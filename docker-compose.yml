services:
  nginx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.nginx
    container_name: nginx_sai
    ports:
      - 80:80
    volumes:
      - ./www:/var/www/sai
      - ./www/sys:/var/www/sys
    depends_on:
      - php
    links:
      - php
    env_file:
      - .env_file
      
  php:
    env_file:
      - .env
    build:
      context: .
      dockerfile: ./docker/Dockerfile.php
    container_name: php_sai
    volumes:
      - ./www:/var/www/sai
      - ./www/sys:/var/www/sys
      - ./docker/php/conf.d/sai.ini:/usr/local/etc/php/conf.d/sai.ini:ro
