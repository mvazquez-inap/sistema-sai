; Legacy SAI templates use "<? echo". Sources and responses are UTF-8.
short_open_tag = On
default_charset = "UTF-8"

; The application connects to "localhost", which mysqlnd opens as a socket.
; The entrypoint forwards that socket to the disposable MariaDB 11.
; Do not set mysqli.default_charset; the library default stays in force.
mysqli.default_socket = /var/run/mysqld/mysqld.sock
pdo_mysql.default_socket = /var/run/mysqld/mysqld.sock
date.timezone = America/Argentina/Buenos_Aires

memory_limit = 1024M
max_execution_time = 30
max_input_time = 60
post_max_size = 8M
upload_max_filesize = 2M

display_errors = On
display_startup_errors = On
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED

opcache.enable = 1
opcache.validate_timestamps = 1
