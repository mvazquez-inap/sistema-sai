[www]
; Nginx forwards both index.php and the .dhtml front scripts.
security.limit_extensions = .php .dhtml
; Let PHP getenv() see the container environment from .env.
clear_env = no
env[SAI_DB_HOST] = $SAI_DB_HOST
env[SAI_DB_USER] = $SAI_DB_USER
env[SAI_DB_PASSWORD] = $SAI_DB_PASSWORD
env[SAI_DB_NAME] = $SAI_DB_NAME
